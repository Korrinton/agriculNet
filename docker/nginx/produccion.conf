# Producción: todo por HTTPS. Los certificados se montan en /etc/nginx/certs
# (fullchain.pem y privkey.pem; p. ej. los de Let's Encrypt, ver README «Producción»).

# HTTP solo redirige a HTTPS (y sirve el reto de Let's Encrypt al renovar el certificado)
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;
    charset utf-8;

    include /etc/nginx/snippets/cabeceras-seguridad.conf;
    # El navegador recordará durante un año que solo debe entrar por HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Recursos compilados con hash en el nombre: se pueden cachear sin límite
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
