# Cabeceras de seguridad comunes (desarrollo y producción). Se incluyen en cada server{}.
# La Content-Security-Policy la pone Laravel (App\Http\Middleware\ContentSecurityPolicy), que sabe
# si está en marcha el servidor de desarrollo de Vite.
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
