# Fija el nombre del proyecto: sin esto, Compose usa el nombre de la carpeta
# ("agriculnet") y levanta un stack paralelo con su propia base de datos vacía.
name: programa_agrario

services:

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/cabeceras-seguridad.conf:/etc/nginx/snippets/cabeceras-seguridad.conf:ro
    depends_on:
      - php-fpm
    networks:
      - agrario
    restart: unless-stopped

  php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - vendor:/var/www/html/vendor
    environment:
      - APP_ENV=${APP_ENV:-local}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agrario
    restart: unless-stopped

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
      # Mismo vendor que php-fpm: sin esto usaría el vendor/ del host, desactualizado
      - vendor:/var/www/html/vendor
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agrario
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agrario
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-agrario}
      POSTGRES_USER: ${DB_USERNAME:-agrario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Solo desde este equipo (para clientes como DBeaver), no desde la red local
    ports:
      - "127.0.0.1:${DB_PORT_EXTERNAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-agrario}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agrario
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Redis no tiene contraseña y guarda las sesiones: solo desde este equipo
    ports:
      - "127.0.0.1:${REDIS_PORT_EXTERNAL:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agrario
    restart: unless-stopped

  # Correo de desarrollo: captura todo lo que envía la app (nada sale a Internet) y lo
  # muestra en http://localhost:8025. En producción no se arranca (docker-compose.prod.yml).
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - agrario
    restart: unless-stopped

  # Copia diaria de la BD en BACKUP_DIR (por defecto ./backups), cifrada si hay BACKUP_PASSPHRASE
  # (ver docker/backup/backup.sh)
  db-backup:
    build:
      context: docker/backup
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_DATABASE:-agrario}
      PGUSER: ${DB_USERNAME:-agrario}
      PGPASSWORD: ${DB_PASSWORD:-secret}
      BACKUP_INTERVAL_HOURS: 23
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_MIN: 7
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_REQUIRE_ENCRYPTION: ${BACKUP_REQUIRE_ENCRYPTION:-0}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      # Fuera de carpetas sincronizadas con la nube (OneDrive, Dropbox…): las copias llevan datos personales
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agrario
    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  vendor:
  # minio_data:

networks:
  agrario:
    driver: bridge
